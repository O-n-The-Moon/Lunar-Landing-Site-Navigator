[project]
name = "lunarnav"
version = "0.1.0"
description = "Offline data pipeline for the Lunar Landing Site Navigator"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "spiceypy>=8.0,<9",
]

[project.scripts]
lunarnav = "lunarnav.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lunarnav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
