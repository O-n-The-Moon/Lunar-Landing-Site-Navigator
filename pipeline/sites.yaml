# Curated landing-site catalog: the hand-edited source of truth (SPEC-data-pipeline.md section 3).
#
# Fields: id (kebab-case, stable forever), name, category, latDeg, lonDeg, coordSource (URL).
# category: artemis3-region | clps | international | reference
# Coordinates: planetocentric, lon east-positive -180..180 (MOON_ME, sphere R = 1737.4 km).
# Sources printed in 0..360 E are converted with lon - 360.
# No site north of 84 S (DEM coverage); Chandrayaan-3 and Chang'e-6 are excluded by design.
#
# Artemis III regions (SPEC Open Q1), still TODO:
#   NASA publishes the nine regions (Oct 2024) as map polygons only, with no coordinates.
#   Selection rule: one published candidate landing site per region, taken from a
#   peer-reviewed source, cited per entry. Pending regions: Peak near Cabeus B, Haworth,
#   Malapert Massif, Mons Mouton Plateau, Mons Mouton, Nobile Rim 1, Nobile Rim 2,
#   de Gerlache Rim 2, Slater Plain.
#   https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
#
# Chang'e-7 (SPEC Open Q3): left out. CNSA has not published a citable target coordinate.

sites:
  # As-landed position from the NAIF IM-2 frame kernel (LANDING_SITE: -84.79059, 29.19567).
  # LROC gives the pre-landing target as -84.78, 29.13 (https://www.lroc.asu.edu/images/1401).
  - id: mons-mouton-im2
    name: IM-2 Athena (Mons Mouton)
    category: clps
    latDeg: -84.79059
    lonDeg: 29.19567
    coordSource: https://naif.jpl.nasa.gov/pub/naif/pds/pds4/clps/clps_spice/spice_kernels/fk/clps_prime1_im2_v01.tf

  # Gracy & Lee, LPSC 2024 #1695: candidate site in the "Connecting Ridge" region,
  # printed as -89.53432 S, 209.94767 E -> lon 209.94767 - 360 = -150.05233.
  - id: connecting-ridge
    name: Shackleton–de Gerlache connecting ridge
    category: reference
    latDeg: -89.53432
    lonDeg: -150.05233
    coordSource: https://www.hou.usra.edu/meetings/lpsc2024/pdf/1695.pdf

  # Permanent-shadow contrast case. IAU Gazetteer crater center (Feature 5450,
  # +East -180..180), used as the floor point.
  - id: shackleton-floor
    name: Shackleton crater floor
    category: reference
    latDeg: -89.67
    lonDeg: 129.78
    coordSource: https://planetarynames.wr.usgs.gov/Feature/5450
