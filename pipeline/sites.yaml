  # As-landed position from the NAIF IM-2 frame kernel (LANDING_SITE: -84.79059, 29.19567).
  # LROC gives the pre-landing target as -84.78, 29.13 (https://www.lroc.asu.edu/images/1401).
  - id: mons-mouton-im2
    name: IM-2 Athena (Mons Mouton)
