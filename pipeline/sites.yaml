# Curated landing-site catalog: the hand-edited source of truth (SPEC-data-pipeline.md section 3).
#
# Fields: id (kebab-case, stable forever), name, category, latDeg, lonDeg, coordSource (URL).
# category: artemis3-region | clps | international | reference
# Coordinates: planetocentric, lon east-positive -180..180 (MOON_ME, sphere R = 1737.4 km).
# Sources printed in 0..360 E are converted with lon - 360.
# No site north of 84 S (project scope: the 182 km polar grid ends at ~84 S; the DEMs
# themselves reach further north). Exception: artemis3-region sites may sit to 83.5 S,
# because 250 km horizon rays must stay inside the 75 S DEM (team decision on #5). Chandrayaan-3 and Chang'e-6 are excluded by design.
#
# Artemis III regions (SPEC Open Q1):
#   NASA publishes the nine regions (Oct 2024) as map polygons only, with no coordinates.
#   https://www.nasa.gov/news-release/nasa-provides-update-on-artemis-iii-moon-landing-regions/
#   Selection rule: one point per region = the mean of all cell centers (centX/centY) of
#   the region's 1 km navigation grid in the USGS data release (McClernan 2024,
#   doi:10.5066/P1MEQ6UK). The grid's own .prj is Lunar Polar Stereographic (south) on the
#   1737.4 km sphere; the inverse projection was cross-checked against PROJ (agrees to
#   1e-13 deg). The grids are rectangles covering each region, so the point is the
#   center of that rectangle: not the best-lit point, and for rim-shaped regions it may
#   fall outside the region's own outline (the outlines are not publicly downloadable).
#   (The bounding boxes in the release's XML metadata do not match the grids; not used.)
#
# Chang'e-7 (SPEC Open Q3): left out. CNSA has not published a citable target coordinate.

sites:
  # Artemis III region centers (selection rule above). All cite the USGS data release.
  # Center is north of 84 S; allowed by the Artemis-region exception (#5).
  - id: peak-near-cabeus-b
    name: Peak near Cabeus B (Artemis III region)
    category: artemis3-region
    latDeg: -83.6514
    lonDeg: -68.7263
    coordSource: https://doi.org/10.5066/P1MEQ6UK

  - id: haworth
    name: Haworth (Artemis III region)
    category: artemis3-region
    latDeg: -86.7661
    lonDeg: -22.6199
