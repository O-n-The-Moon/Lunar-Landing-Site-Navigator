name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job so a single `ci` check can be required on main. Path filtering
  # happens inside the job: a workflow-level `paths:` filter would skip the job
  # and leave the required check pending forever.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          # The workflow file itself affects both jobs.
          if echo "$changed" | grep -q '^\.github/workflows/ci\.yml$'; then
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pipeline=$(echo "$changed" | grep -q '^pipeline/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$(echo "$changed" | grep -q '^web/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        if: steps.changes.outputs.pipeline == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Pipeline checks
        if: steps.changes.outputs.pipeline == 'true'
        working-directory: pipeline
        run: |
          uv sync
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.web == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web checks
        if: steps.changes.outputs.web == 'true'
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
